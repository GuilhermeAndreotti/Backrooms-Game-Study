# ---------------------------------------------------------------------------
# nginx reverse proxy for Backrooms Level 0
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/backrooms
#   sudo ln -s /etc/nginx/sites-available/backrooms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to add HTTPS (it rewrites this file automatically):
#   sudo certbot --nginx -d SEU_DOMINIO
# ---------------------------------------------------------------------------

# Map required so the WebSocket upgrade header survives proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or use the server's IP address.
    server_name SEU_DOMINIO;

    # three.js is ~550 KB; without this the first load is painfully slow.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    client_max_body_size 1m;

    # --- WebSocket relay ---------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A game session is a long-lived socket: do not time it out at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Game client -------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
